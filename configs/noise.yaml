name: golos112_fan_from_scratch
model:
  sample_rate: 16000
  compute_eval_loss: false
  log_prediction: false
  skip_nan_grad: false
  model_defaults:
    enc_hidden: 512
    pred_hidden: 640
    joint_hidden: 640
    tdt_durations:
    - 0
    - 1
    - 2
    - 3
    - 4
    num_tdt_durations: 5
  train_ds:
    manifest_filepath: /tf/ai_nazarov/proj1/data/train_mixed.jsonl
    sample_rate: 16000
    batch_size: 16
    shuffle: true
    num_workers: 8
    pin_memory: true
    max_duration: 20
    min_duration: 0.3
    is_tarred: false
    tarred_audio_filepaths: null
    shuffle_n: 2048
    bucketing_strategy: synced_randomized
    bucketing_batch_size: null
    use_lhotse: false
    augmentor:
      proj1_fan_noise:
        prob: 0.5
        manifest_path: /tf/ai_nazarov/proj1/data/noise_train.jsonl
        min_snr_db: 5.0
        max_snr_db: 20.0
  validation_ds:
    manifest_filepath: /tf/ai_nazarov/proj1/data/val_mixed_selection.jsonl
    sample_rate: 16000
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 4
    pin_memory: true
    use_lhotse: false
  test_ds:
    manifest_filepath: null
    sample_rate: 16000
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true
  tokenizer:
    dir: /tf/ai_nazarov/proj1/tokenizer112
    type: bpe
  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    normalize: per_feature
    window_size: 0.025
    window_stride: 0.01
    window: hann
    features: 128
    n_fft: 512
    frame_splicing: 1
    dither: 1.0e-05
    pad_to: 0
  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05
  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: 128
    feat_out: -1
    n_layers: 17
    d_model: 512
    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    causal_downsampling: false
    reduction: null
    reduction_position: null
    reduction_factor: 1
    ff_expansion_factor: 4
    self_attention_model: rel_pos
    n_heads: 8
    att_context_size:
    - -1
    - -1
    att_context_style: regular
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 5000
    conv_kernel_size: 9
    conv_norm_type: batch_norm
    conv_context_size: null
    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1
    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear
    stochastic_depth_start_layer: 1
  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true
    prednet:
      pred_hidden: 640
      pred_rnn_layers: 1
      t_max: null
      dropout: 0.2
  joint:
    _target_: nemo.collections.asr.modules.RNNTJoint
    log_softmax: null
    preserve_memory: false
    fuse_loss_wer: true
    fused_batch_size: 4
    jointnet:
      joint_hidden: 640
      activation: relu
      dropout: 0.2
    num_extra_outputs: 5
  decoding:
    strategy: greedy_batch
    model_type: tdt
    durations:
    - 0
    - 1
    - 2
    - 3
    - 4
    greedy:
      max_symbols: 10
    beam:
      beam_size: 2
      return_best_hypothesis: false
      score_norm: true
      tsd_max_sym_exp: 50
      alsd_max_target_len: 2.0
  aux_ctc:
    ctc_loss_weight: 0.3
    use_cer: false
    ctc_reduction: mean_batch
    decoder:
      _target_: nemo.collections.asr.modules.ConvASRDecoder
      feat_in: null
      num_classes: -1
      vocabulary: []
    decoding:
      strategy: greedy_batch
  interctc:
    loss_weights: []
    apply_at_layers: []
  loss:
    loss_name: tdt
    tdt_kwargs:
      fastemit_lambda: 0.0
      clamp: -1.0
      durations:
      - 0
      - 1
      - 2
      - 3
      - 4
      sigma: 0.02
      omega: 0.1
  optim:
    name: adamw
    lr: 3.0e-05
    betas:
    - 0.9
    - 0.98
    weight_decay: 1.0e-06
    sched:
      name: CosineAnnealing
      warmup_steps: 1000
      min_lr: 1.0e-06
trainer:
  devices: 1
  accelerator: gpu
  max_epochs: 5
  precision: 32
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 5
  enable_progress_bar: false
  benchmark: false
seed: 112
